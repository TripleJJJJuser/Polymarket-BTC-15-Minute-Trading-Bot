[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-15m-bot"
version = "0.1.0"
description = "Polymarket 15m multi-asset trading bot"
requires-python = ">=3.10"
dependencies = [
  "loguru>=0.7.2",
  "python-dotenv>=1.0.1",
  "redis>=5.0.1",
  "httpx>=0.27.0",
  "prometheus-client>=0.20.0",
]

[tool.setuptools]
py-modules = ["run_bot", "patch_gamma_markets", "redis_control", "view_paper_trades"]
